# Cloudflare Pages configuration for the TIS Tech Council site.
# See README.md → "Deploying to Cloudflare Pages".
name = "tis-tech-council"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "tis-tech-council"
# Paste the Database ID from Cloudflare (D1 → tis-tech-council). Not a secret.
database_id = "00000000-0000-0000-0000-000000000000"
