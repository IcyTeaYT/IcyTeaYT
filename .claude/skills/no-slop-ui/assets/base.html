<!doctype html>
<!--
  base.html — the Council-style shell for single-file pages (claude.ai artifacts, prototypes, one-pagers).
  It gives you tokens, light/edge primitives, smooth scroll, one orchestrated entrance, and the quality floor.
  It deliberately contains NO sections: compose the page from your design plan. Never ship placeholder sections.
-->
<html lang="en" class="no-js">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#000000" />
<title>PAGE TITLE</title>
<meta name="description" content="One plain sentence: what this is and who it's for." />
<meta property="og:title" content="PAGE TITLE" />
<meta property="og:description" content="Same idea as the description, shorter." />
<meta property="og:image" content="og.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- Default family: Geist. Swap per brief (see references/council-style.md › Type). -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
<style>
/* ───────── Tokens ───────── */
:root {
  color-scheme: dark;
  --bg: #000;
  --fg: #fff;
  --fg-2: rgb(255 255 255 / .72);   /* body copy */
  --fg-3: rgb(255 255 255 / .52);   /* secondary — still ≥ 4.5:1 on black */
  --fg-4: rgb(255 255 255 / .34);   /* decorative only, never for text people must read */
  --surface-1: rgb(255 255 255 / .03);
  --surface-2: rgb(255 255 255 / .055);
  --surface-3: rgb(255 255 255 / .085);
  --line: rgb(255 255 255 / .09);
  --line-strong: rgb(255 255 255 / .16);
  --edge-top: rgb(255 255 255 / .2);   /* light catching the top edge */
  --glow: rgb(255 255 255 / .07);
  --accent: #fff;                      /* replace ONLY with a colour taken from the subject/brand */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 22px; --r-xl: 32px; --r-pill: 999px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --ease-io: cubic-bezier(.65, 0, .35, 1);
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* Fluid type scale (major third-ish). Tracking tightens as size grows. */
  --t-sm: clamp(.8125rem, .79rem + .1vw, .875rem);
  --t-base: clamp(1rem, .97rem + .15vw, 1.0625rem);
  --t-lg: clamp(1.1875rem, 1.1rem + .4vw, 1.375rem);
  --t-h3: clamp(1.375rem, 1.2rem + .8vw, 1.75rem);
  --t-h2: clamp(2rem, 1.5rem + 2.4vw, 3.5rem);
  --t-h1: clamp(2.75rem, 1.6rem + 5.6vw, 6.5rem);
  --t-display: clamp(3.5rem, 1.8rem + 8.5vw, 10rem);
  --gutter: clamp(20px, 4vw, 40px);
  --section: clamp(5rem, 3.5rem + 5vw, 8.5rem);   /* adjacent sections: consider halving the top padding */
  --container: 1200px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* Optional light variant for viewers that force it; the Council style is dark by design. */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #fff; --fg: #000; --fg-2: rgb(0 0 0 / .72); --fg-3: rgb(0 0 0 / .56); --fg-4: rgb(0 0 0 / .34);
  --surface-1: rgb(0 0 0 / .025); --surface-2: rgb(0 0 0 / .045); --surface-3: rgb(0 0 0 / .07);
  --line: rgb(0 0 0 / .08); --line-strong: rgb(0 0 0 / .16); --edge-top: rgb(0 0 0 / .12); --glow: rgb(0 0 0 / .04); --accent: #000;
}

/* ───────── Base ───────── */
*, *::before, *::after { box-sizing: inherit; margin: 0; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); -webkit-text-size-adjust: 100%; }
html.lenis, html.lenis body { height: auto; }
.lenis:not(.lenis-autoToggle).lenis-stopped { overflow: clip; }
.lenis [data-lenis-prevent] { overscroll-behavior: contain; }
.lenis.lenis-smooth iframe { pointer-events: none; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: var(--t-base); line-height: 1.55;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  font-feature-settings: "ss01", "cv11"; overflow-x: clip;
}
img, video, svg, canvas { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
::selection { background: rgb(255 255 255 / .92); color: #000; }
:focus-visible { outline: 2px solid rgb(255 255 255 / .75); outline-offset: 3px; border-radius: 4px; }
.skip { position: absolute; left: 12px; top: -48px; padding: 8px 12px; background: var(--fg); color: var(--bg); border-radius: var(--r-sm); z-index: 100; }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + 12px); }

/* ───────── Type roles ───────── */
.display { font-size: var(--t-display); line-height: .92; letter-spacing: -.055em; font-weight: 500; }
.h1 { font-size: var(--t-h1); line-height: .98; letter-spacing: -.045em; font-weight: 500; }
.h2 { font-size: var(--t-h2); line-height: 1.05; letter-spacing: -.035em; font-weight: 500; }
.h3 { font-size: var(--t-h3); line-height: 1.2; letter-spacing: -.02em; font-weight: 500; }
.lead { font-size: var(--t-lg); line-height: 1.5; color: var(--fg-2); max-width: 38ch; letter-spacing: -.01em; }
.body { color: var(--fg-2); max-width: 62ch; }
.muted { color: var(--fg-3); }
.small { font-size: var(--t-sm); }
.balance { text-wrap: balance; } .pretty { text-wrap: pretty; }
/* Light falling from above: one display line only, never a colour gradient. */
.lit { background: linear-gradient(180deg, var(--fg) 35%, rgb(255 255 255 / .55)); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ───────── Layout ───────── */
.container { width: min(100% - 2 * var(--gutter), var(--container)); margin-inline: auto; }
.section { padding-block: var(--section); position: relative; }
.grid-12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: clamp(16px, 2vw, 24px); }

/* ───────── Light & material ───────── */
/* Hairline with light on the top edge (gradient border via mask). */
.edge { position: relative; isolation: isolate; }
.edge::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 1;
  background: linear-gradient(180deg, var(--edge-top), var(--line) 38%, rgb(255 255 255 / .03));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
/* Surface that catches a cursor spotlight (JS sets --mx/--my). */
.spot {
  --mx: 50%; --my: -20%;
  background:
    radial-gradient(520px circle at var(--mx) var(--my), rgb(255 255 255 / .06), transparent 45%),
    var(--surface-1);
}
.spot.edge::before {
  background:
    radial-gradient(360px circle at var(--mx) var(--my), rgb(255 255 255 / .38), transparent 40%),
    linear-gradient(180deg, var(--edge-top), var(--line) 38%, rgb(255 255 255 / .03));
}
.panel { border-radius: var(--r-lg); background: var(--surface-1); }
/* A light source above a section (use once or twice per page). */
.glow-top { position: absolute; inset: 0 0 auto; height: 70%; pointer-events: none; z-index: -1;
  background: radial-gradient(60% 55% at 50% 0%, var(--glow), transparent 70%); }
/* Film grain to kill gradient banding. Fixed, 3–4 %. */
.grain { position: fixed; inset: -50%; pointer-events: none; z-index: 60; opacity: .035;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* ───────── Controls ───────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px;
  border-radius: var(--r-pill); font-size: var(--t-sm); font-weight: 500; letter-spacing: -.005em; white-space: nowrap;
  transition: background-color .2s var(--ease), color .2s var(--ease), transform .2s var(--ease); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--fg); color: var(--bg); }
.btn-primary:hover { background: rgb(255 255 255 / .86); }
.btn-secondary { background: var(--surface-2); color: var(--fg); }
.btn-secondary:hover { background: var(--surface-3); }
.link { color: var(--fg); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 4px; transition: text-decoration-color .2s; }
.link:hover { text-decoration-color: var(--fg); }

/* ───────── Nav ───────── */
.nav { position: fixed; inset: 0 0 auto; z-index: 50; padding-top: env(safe-area-inset-top, 0px);
  transition: transform .45s var(--ease), background-color .3s, border-color .3s; border-bottom: 1px solid transparent; }
.nav.is-scrolled { background: rgb(0 0 0 / .62); -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px); border-bottom-color: var(--line); }
.nav.is-hidden { transform: translateY(-100%); }
.nav__inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }

/* ───────── Motion states (only when JS runs, never with reduced motion) ───────── */
.js [data-sequence] > *, .js [data-reveal] { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .js [data-sequence] > *, .js [data-reveal] { opacity: 1 !important; transform: none !important; filter: none !important; }
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="grain" aria-hidden="true"></div>

<header class="nav" data-nav>
  <div class="container nav__inner">
    <a href="#" aria-label="Home"><!-- logo/wordmark --></a>
    <nav aria-label="Primary"><!-- 3–5 links max --></nav>
  </div>
</header>

<main id="main">
  <!--
    Compose sections from the design plan. Primitives available:
      .section .container .grid-12 · .display .h1 .h2 .h3 .lead .body .muted .small .lit
      .panel .edge .spot (cursor spotlight) .glow-top · .btn .btn-primary .btn-secondary .link
      data-sequence  → children enter in an orchestrated stagger on load (use once: the hero)
      data-reveal    → element enters when scrolled into view (use for 1–2 moments that matter, not every section)
  -->
</main>

<footer class="container"><!-- real footer content --></footer>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@13.4.6/dist/motion.js"></script>
<script>
(() => {
  const root = document.documentElement;
  root.classList.replace('no-js', 'js');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hasMotion = typeof window.Motion !== 'undefined';
  const show = (els) => els.forEach((el) => { el.style.opacity = 1; });

  // 1. Smooth scroll (skipped for reduced motion or if the library failed to load)
  let lenis = null;
  if (!reduce && typeof window.Lenis !== 'undefined') {
    lenis = new Lenis({ lerp: 0.1, autoRaf: true });
    document.querySelectorAll('a[href^="#"]').forEach((a) => a.addEventListener('click', (e) => {
      const id = a.getAttribute('href');
      if (id.length > 1 && document.querySelector(id)) { e.preventDefault(); lenis.scrollTo(id, { offset: -72 }); }
    }));
  }

  // 2. Nav: solid after 8px, hides on scroll down, returns on scroll up
  const nav = document.querySelector('[data-nav]');
  if (nav) {
    let last = 0;
    const onScroll = () => {
      const y = window.scrollY;
      nav.classList.toggle('is-scrolled', y > 8);
      nav.classList.toggle('is-hidden', y > 240 && y > last && !nav.contains(document.activeElement));
      last = y;
    };
    addEventListener('scroll', onScroll, { passive: true }); onScroll();
  }

  // 3. Cursor spotlight on .spot surfaces (pointer devices only)
  if (matchMedia('(hover: hover)').matches) {
    document.querySelectorAll('.spot').forEach((el) => el.addEventListener('pointermove', (e) => {
      const r = el.getBoundingClientRect();
      el.style.setProperty('--mx', `${e.clientX - r.left}px`);
      el.style.setProperty('--my', `${e.clientY - r.top}px`);
    }));
  }

  const seqItems = [...document.querySelectorAll('[data-sequence] > *')];
  const reveals = [...document.querySelectorAll('[data-reveal]')];
  if (reduce || !hasMotion) { show(seqItems); show(reveals); return; }
  const { animate, inView, stagger } = window.Motion;

  // 4. The one orchestrated moment: hero children rise out of a soft blur, 80 ms apart
  if (seqItems.length) {
    animate(seqItems, { opacity: [0, 1], y: [18, 0], filter: ['blur(10px)', 'blur(0px)'] },
      { duration: 1, delay: stagger(0.08, { startDelay: 0.1 }), ease: [0.22, 1, 0.36, 1] });
  }
  // 5. Selective reveals
  reveals.forEach((el) => inView(el, () => {
    animate(el, { opacity: [0, 1], y: [24, 0] }, { duration: 0.9, ease: [0.22, 1, 0.36, 1] });
  }, { amount: 0.35 }));
})();
</script>
</body>
</html>
